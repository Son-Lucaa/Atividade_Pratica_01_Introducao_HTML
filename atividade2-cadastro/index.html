<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">

        <img src="imagem-da-logo/uninassau.png" alt="Logo da Uninassau">

        <h1>Criar Conta</h1>

        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" placeholder="Seu nome completo">
        
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu.email@exemplo.com">

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha">
        

        <label for="confirma-senha">Confirme sua senha</label>
        <input type="password" id="confirma-senha" placeholder="Digite sua senha novamente">
        

        <label for="data-nascimento">Data de Nascimento</label>
        <input type="date" id="data-nascimento">
        
        <label for="genero">Gênero</label>
        <select id="genero">
            <option value="" disabled selected>Selecione</option>
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
            <option value="outro">Outro</option>
            <option value="nao-informar">Prefiro não informar</option>
        </select>

        <label>
            <input type="checkbox" id="termos">
            Aceito os <a href="#">Termos de Uso</a>
        </label>

        <button type="submit">Cadastrar</button>

        <p>Já tem uma conta? <a href="#">Entrar</a></p>

    </div>
    
</body>
</html>
